apiVersion: v1
kind: Namespace
metadata:
  name: step01-local
---
apiVersion: v1
kind: Secret
metadata:
  name: step01-db-secret
  namespace: step01-local
type: Opaque
stringData:
  POSTGRES_DB: step01
  POSTGRES_USER: step01
  POSTGRES_PASSWORD: step01
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: step01-local
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: step01-postgres
  namespace: step01-local
spec:
  replicas: 1
  selector:
    matchLabels:
      app: step01-postgres
  template:
    metadata:
      labels:
        app: step01-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:17-alpine
          ports:
            - containerPort: 5432
              name: postgres
          envFrom:
            - secretRef:
                name: step01-db-secret
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: postgres-data
---
apiVersion: v1
kind: Service
metadata:
  name: step01-postgres
  namespace: step01-local
spec:
  selector:
    app: step01-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: step01-app
  namespace: step01-local
spec:
  replicas: 1
  selector:
    matchLabels:
      app: step01-app
  template:
    metadata:
      labels:
        app: step01-app
    spec:
      containers:
        - name: app
          image: step01:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: prod
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://step01-postgres:5432/step01
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: step01-db-secret
                  key: POSTGRES_USER
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: step01-db-secret
                  key: POSTGRES_PASSWORD
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: step01-app
  namespace: step01-local
  labels:
    app: step01-app
spec:
  type: NodePort
  selector:
    app: step01-app
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 30080
