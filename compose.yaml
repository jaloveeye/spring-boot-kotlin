services:
  postgres:
    image: postgres:17-alpine
    container_name: step01-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-step01}
      POSTGRES_USER: ${POSTGRES_USER:-step01}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-step01}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-step01} -d $${POSTGRES_DB:-step01}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres-data:
